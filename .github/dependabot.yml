version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    # widen adds a new release to a constraint instead of replacing the old one.
    versioning-strategy: widen
    ignore:
      # brick/math 0.x minors are breaking: 0.15 is not compatible with the upper-case
      # RoundingMode cases this package uses, so it is upgraded by hand, never widened.
      - dependency-name: brick/math
        versions: [">=0.15"]
    groups:
      composer-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /docker/oracle
    schedule:
      interval: monthly
    groups:
      oracle-base-images:
        patterns: ["*"]
