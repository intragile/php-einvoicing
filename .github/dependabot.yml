version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    # widen keeps older majors in "^0.12|^0.13" style constraints instead of dropping them.
    versioning-strategy: widen
    groups:
      composer-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /docker/oracle
    schedule:
      interval: monthly
    groups:
      oracle-base-images:
        patterns: ["*"]
