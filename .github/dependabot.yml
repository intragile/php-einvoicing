version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    # widen adds a new release to a constraint instead of replacing the old one.
    versioning-strategy: widen
    ignore:
      # brick/math 0.x minors are breaking, so a new minor is tested and upgraded by hand,
      # never widened.
      - dependency-name: brick/math
        versions: [">=0.15"]
      # The rule packages live in this repository as path repositories and are released
      # together with the core, so Dependabot neither can nor should update them.
      - dependency-name: intragile/einvoicing-rules-*
    groups:
      composer-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /docker/oracle
    schedule:
      interval: monthly
    groups:
      oracle-base-images:
        patterns: ["*"]
