name: tests
on:
  push:
  pull_request:
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, zip, zlib
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer fetch-official
      # The VERI*FACTU schemas and the AEAT example are downloaded, never committed.
      - run: composer fetch-official -- --spain
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpunit --group verifactu-official --fail-on-skipped
      - run: composer compile-rules -- --check
      - run: vendor/bin/phpstan analyse --memory-limit=1G

  prefer-lowest:
    # Installs the lowest versions the constraints allow, so a lower bound that is too low fails
    # here. Composer skips releases with known security advisories, so each floor in composer.json
    # is kept at the lowest release this job can actually install.
    runs-on: ubuntu-latest
    name: PHP 8.3 / prefer-lowest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, libxml, mbstring, zip, zlib
          coverage: none
      - run: composer validate --strict
      - run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: composer fetch-official
      - run: composer fetch-official -- --spain
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpunit --group verifactu-official --fail-on-skipped

  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test

  oracle:
    # Runs the official CEN EN 16931, Peppol and Factur-X validation stylesheets
    # through SaxonC-HE (docker/oracle). PHP 8.6 is not in this matrix: the SaxonC-HE 13.1.1 PHP
    # extension does not compile against PHP 8.6 (it uses macros PHP 8.6 removed). Add 8.6 with
    # a SaxonC release that builds; the tests job above covers PHP 8.6.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    name: Oracle / PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, zip, zlib
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer fetch-official
      # The Factur-X parity test reads the FeRD examples, which are downloaded, never committed.
      - run: composer fetch-official -- --facturx-examples
      # The French parity tests read the FNFE-MPE France_RFE files, which are downloaded, never committed.
      - run: composer fetch-official -- --france
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: docker/oracle
          build-args: PHP_VERSION=${{ matrix.php }}
          tags: php-einvoicing-oracle:php${{ matrix.php }}
          load: true
          push: false
          cache-from: type=gha,scope=oracle-php${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=oracle-php${{ matrix.php }}
      - run: docker/oracle/run.sh ${{ matrix.php }}
        env:
          ORACLE_SKIP_BUILD: '1'

  next-versions:
    # Early warning against the next PHP release, installed with minimum-stability dev.
    # Static analysis and style are left to the jobs above. A failure here does not fail
    # the run, so check this job's result.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.7' }
    name: Next / PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, zip, zlib
          coverage: none
      - name: Retarget composer.json at the upcoming versions
        run: |
          php -r '
            $c = json_decode(file_get_contents("composer.json"), true);
            foreach (["phpstan/phpstan", "laravel/pint"] as $tool) {
                unset($c["require-dev"][$tool]);
            }
            $c["minimum-stability"] = "dev";
            $c["prefer-stable"] = true;
            file_put_contents("composer.json", json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          '
      - run: composer update --prefer-dist --no-interaction --no-progress --ignore-platform-req=php+
      - name: Restore the committed composer.json for the packaging tests
        run: git checkout -- composer.json
      - run: composer fetch-official
      - run: composer fetch-official -- --spain
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpunit --group verifactu-official --fail-on-skipped
